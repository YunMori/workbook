services:
  web:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: backend/.env
    environment:
      # DB 파일만 볼륨에 둔다. 이미지를 다시 만들어도 응시 기록과 admin 수정분이 남는다.
      SQLITE_PATH: /srv/app/db/db.sqlite3
    volumes:
      - db:/srv/app/db
    restart: unless-stopped

  nginx:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      # 다른 프로젝트가 80을 쓰고 있으면 HTTP_PORT=8080 처럼 바꿔서 띄운다.
      - "${HTTP_PORT:-80}:80"
    depends_on:
      - web
    restart: unless-stopped

volumes:
  db:
