# /etc/nginx/sites-available/workbook 로 복사한 뒤
#   sudo ln -sf /etc/nginx/sites-available/workbook /etc/nginx/sites-enabled/workbook
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# server_name 을 EC2 탄력적 IP(또는 도메인)로 바꿔야 한다.

server {
    listen 80;
    server_name __SERVER_NAME__;

    client_max_body_size 4m;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Django admin의 CSS/JS (collectstatic 결과물)
    location /static/ {
        alias /srv/workbook/backend/staticfiles/;
        access_log off;
        expires 30d;
    }

    location ~ ^/(api|admin)/ {
        proxy_pass http://unix:/run/workbook/gunicorn.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;

        # HTTPS를 붙이기 전까지 admin 비밀번호가 평문으로 오간다.
        # 아래 두 줄의 주석을 풀고 __MY_IP__ 를 내 공인 IP로 바꾸면 관리자 화면이 그 IP에서만 열린다.
        # allow __MY_IP__;
        # deny all;
    }

    # Vue SPA — /exams/1/study 를 직접 열거나 새로고침해도 index.html이 응답해야 라우터가 받는다
    location / {
        root /srv/workbook/frontend/dist;
        try_files $uri $uri/ /index.html;
    }

    # Vite가 파일명에 해시를 넣으므로 길게 캐시해도 안전하다
    location /assets/ {
        root /srv/workbook/frontend/dist;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
