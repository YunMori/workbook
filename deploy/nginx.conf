# nginx 컨테이너 설정. 이미지에 구워지므로 서버에서 손댈 일이 없다.
# /api/, /admin/, /static/ 은 web 컨테이너(gunicorn)로, 나머지는 Vue SPA.

upstream django {
    server web:8000;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 4m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # /static/ 은 WhiteNoise가 admin CSS/JS를 응답한다 (정적 파일 볼륨 공유 불필요)
    location ~ ^/(api|admin|static)/ {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;

        # HTTPS를 붙이기 전까지 admin 비밀번호가 평문으로 오간다.
        # 아래 주석을 풀고 __MY_IP__ 를 내 공인 IP로 바꾸면 그 IP에서만 열린다.
        # allow __MY_IP__;
        # deny all;
    }

    # Vite가 파일명에 해시를 넣으므로 길게 캐시해도 안전하다
    location /assets/ {
        root /usr/share/nginx/html;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Vue SPA — /exams/1/study 를 직접 열거나 새로고침해도 index.html이 응답해야 라우터가 받는다
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
